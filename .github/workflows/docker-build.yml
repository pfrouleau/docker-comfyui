name: Docker Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract branch name
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//_/g')" >> $GITHUB_ENV

      - name: Set build arguments
        run: |
          . ./default.env
          echo "BASE_IMAGE=nvidia/cuda:${CUDA_VERSION}-devel-${OS_VERSION}" >> $GITHUB_ENV
          echo "COMFYUI_VERSION=${COMFYUI_VERSION}" >> $GITHUB_ENV

      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build and tag Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          target: base
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            COMFYUI_VERSION=${{ env.COMFYUI_VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            jamesbrink/comfyui:latest
            jamesbrink/comfyui:${{ github.sha }}
            jamesbrink/comfyui:${{ env.BRANCH_NAME }}
            jamesbrink/comfyui:${{ env.COMFYUI_VERSION }}
